openapi: 3.1.0
info:
  title: Record Readiness Assessment
  version: "1.0.0"
servers:
  - url: https://renovagent-five.vercel.app
security:
  - clientApiBearer: []
paths:
  /api/yoxa/projects/{projectId}/readiness:
    post:
      operationId: recordReadinessAssessment
      summary: Persist a per-domain readiness gate decision for a project.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assessments]
              properties:
                assessments:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [domain, state]
                    properties:
                      domain: { type: string, enum: [family, spatial, preference, budget, constraint] }
                      state:
                        type: string
                        enum: [not_started, discovery_in_progress, partially_understood, sufficient_for_validation, validated]
                      reason:
                        type: string
                        description: Free-text explanation, blockers, and accepted uncertainty for this domain's gate decision.
      responses:
        "200":
          description: Readiness was recorded.
          content:
            application/json:
              schema:
                type: object
                required: [readiness]
                properties:
                  readiness:
                    type: array
                    items:
                      type: object
                      required: [project_id, domain, state]
                      properties:
                        project_id: { type: string, format: uuid }
                        domain: { type: string }
                        state: { type: string }
                        reason: { type: [string, "null"] }
                        updated_at: { type: string, format: date-time }
        "400":
          description: No assessments were supplied.
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
components:
  securitySchemes:
    clientApiBearer:
      type: http
      scheme: bearer
